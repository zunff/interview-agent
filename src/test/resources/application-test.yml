# 测试环境配置

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_agent
    username: interview
    password: interview123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # Spring AI 模型配置（与 dev 环境保持一致）
  ai:
    openai:
      api-key: ${SPRING_AI_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        completions-path: /chat/completions
        options:
          model: qwen3-coder-next
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        enabled: false  # 测试环境禁用 vector store
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

# 联网搜索配置（测试环境）
search:
  tavily:
    api-key: ${TAVILY_API_KEY}
    enabled: false  # 测试环境禁用联网搜索

# 面试配置（测试环境）
interview:
  graph:
    main-recursion-limit: 500
  resume-analysis:
    recursion-limit: 25
  multimodal:
    api-key: ${MULTIMODAL_API_KEY}
    enabled: false  # 测试环境禁用多模态
    omni:
      model: qwen3.5-omni-plus-2026-03-15
    asr:
      model: fun-asr-flash-8k-realtime
      language: zh
      input-audio-format: pcm
      sample-rate: 16000
  tts:
    enabled: false  # 测试环境禁用 TTS
    model: qwen3-tts-instruct-flash-realtime-2026-01-22
    voice: Ethan
  knowledge:
    enabled: false  # 测试环境禁用知识库

# 日志级别
logging:
  level:
    root: INFO
    com.zunff.interview: DEBUG
    org.testcontainers: INFO